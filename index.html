<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PushRuzzo - Upload S3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .form-section h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1e293b;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            align-items: end;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #4b5563;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #059669;
        }

        .file-list {
            background: #f8fafc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }

        .file-list:empty {
            display: none;
        }

        .file-item {
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
        }

        .progress-container {
            background: #f8fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            display: none;
        }

        .progress-item {
            margin-bottom: 16px;
        }

        .progress-item label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #374151;
        }

        progress {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        progress::-webkit-progress-bar {
            background: #e5e7eb;
        }

        progress::-webkit-progress-value {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
        }

        progress::-moz-progress-bar {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
        }

        .current-file {
            font-weight: 500;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .status {
            padding: 16px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 16px;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .result-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
        }

        .result-success {
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .result-error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 12px;
            }

            .actions {
                flex-direction: column;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 PushRuzzo</h1>
            <p>Upload sicuro su Amazon S3</p>
        </div>

        <div class="content">
            <div class="form-section">
                <h3>⚙️ Configurazione Upload</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="rifLavorazione">Rif.Lavorazione *</label>
                        <input type="text" id="rifLavorazione" placeholder="Es: LAV-2024-001" required>
                    </div>
                    <div class="form-group">
                        <label for="tipologiaFile">Tipologia File *</label>
                        <select id="tipologiaFile" required>
                            <option value="">Seleziona...</option>
                            <option value="Avvisi">📋 Avvisi</option>
                            <option value="Scansioni">📄 Scansioni</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="checkUpdates">🔄 Controlla Aggiornamenti</button>
                <button class="btn btn-secondary" id="testConnection">🔗 Test Connessione</button>
                <button class="btn btn-primary" id="selectFolder">📁 Seleziona Cartella</button>
                <button class="btn btn-success" id="upload" disabled>🚀 Upload su S3</button>
            </div>

            <div id="fileList" class="file-list"></div>

            <div id="progressContainer" class="progress-container">
                <div id="currentFile" class="current-file">Preparazione upload...</div>
                <div class="progress-item">
                    <label>File Corrente</label>
                    <progress id="fileProgressBar" value="0" max="100"></progress>
                </div>
                <div class="progress-item">
                    <label>Progresso Totale</label>
                    <progress id="overallProgressBar" value="0" max="100"></progress>
                    <div id="overallProgressText">0%</div>
                </div>
            </div>

            <div id="status" class="status info">Pronto per l'uso</div>

            <div id="exportSection" style="display: none; margin-top: 20px;">
              <button class="btn btn-primary" id="exportCsv">📊 Esporta CSV</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
